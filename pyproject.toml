[project]
name = "agentic-marketplace-gateway"
version = "0.1.0"
description = "Deterministic Model Context Protocol (MCP) gateway & safety airlock for enterprise marketplace agents"
authors = [{ name = "Paul Trafford", email = "paul.trafford@protonmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

